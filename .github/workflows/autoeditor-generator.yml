name: VideoForge - Gerador AutoEditor (plano ou video privado)

on:
  push:
    branches: [main]
    paths:
      - geradores/autoeditor/gerador.json
      - geradores/autoeditor/exemplo-manifesto.json
      - config/autoeditor-once-2026-11-12.json
      - config/autoeditor-visual-consistency-once-2026-11-12.json
  workflow_dispatch:
    inputs:
      action:
        description: "plan = sem custo; render = imagens reais e MP4"
        required: true
        default: plan
        type: choice
        options: [plan, render]
      manifest:
        description: "Manifesto de video dentro de geradores/ ou canal/"
        required: true
        default: geradores/autoeditor/exemplo-manifesto.json
        type: string
      authorize_render:
        description: "Confirmar custos/cotas e gerar apenas para revisao"
        required: true
        default: false
        type: boolean
      max_image_calls:
        description: "Limite APROVADO (1-48); exemplo atual requer 26. Default 12 NÃO basta."
        required: true
        default: 12
        type: number

permissions:
  contents: read
  statuses: write  # fallback verificavel das etapas por funcionario
  checks: write  # somente registros publicos dos trabalhos reais do pipeline

concurrency:
  group: autoeditor-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      inputs.action == 'plan' ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'test(autoeditor): one-shot user-authorized render 2026-11-12'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar plano sem IA, sem imagens e sem upload
        shell: bash
        env:
          JOB_MANIFEST: ${{ inputs.manifest || 'geradores/autoeditor/exemplo-manifesto.json' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from videoforge.generators.autoeditor import load_manifest,plan
          from videoforge.channel_agents.storage import channel_output_root
          root=Path.cwd().resolve()
          path=(root/Path(os.environ["JOB_MANIFEST"])).resolve()
          if not (path.is_relative_to(root/"geradores") or path.is_relative_to(root/"canal")):
              raise SystemExit("AUTOEDITOR_MANIFEST_PATH_NOT_ALLOWED")
          obj=plan(load_manifest(path))
          dest=(channel_output_root(obj["channel"], root=root) /
                "editorial" / "autoeditor-plan.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("AUTOEDITOR_PLAN_ONLY_NO_GENERATION_NO_UPLOAD")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autoeditor-plan-${{ github.run_id }}
          path: output/*/editorial/autoeditor-plan.json
          retention-days: 7
          if-no-files-found: error

  render:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'render' &&
      inputs.authorize_render == true &&
      github.actor == 'HelioConde' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: proxy-runtime
    timeout-minutes: 90
    env:
      GIN_MODE: release
      DEBUG_LOG_PAYLOADS: 'false'
      PORT: '8080'
      VIDEOFORGE_AUTOEDITOR_RENDER_AUTHORIZED: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Motor Remotion original fixado
        uses: actions/checkout@v4
        with:
          repository: HelioConde/AutoEditorVideo
          ref: ec85db5bc74455122e4501aba05bd2dd3fd0df2c
          path: autoeditor-source
          persist-credentials: false
      - name: Go Codex Proxy original fixado
        uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: upstream-codex-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version-file: upstream-codex-proxy/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: autoeditor-source/motion-remotion/package-lock.json
      - name: Instalar ambiente de render e narração
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'edge-tts>=7,<9'
          cd autoeditor-source/motion-remotion
          npm ci
      - name: Validar contratos antes de usar segredos
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_autoeditor_generator.py' -v
          python -m unittest discover -s tests -p 'test_visual_lock.py' -v
          python -m unittest discover -s tests -p 'test_scene_layers.py' -v
          python -m unittest discover -s tests -p 'test_fofinho_motion.py' -v
          python -m unittest discover -s tests -p 'test_generator_registry.py' -v
      - name: Bloquear orçamento insuficiente ANTES de qualquer Proxy ou geração
        shell: bash
        env:
          JOB_MANIFEST: ${{ inputs.manifest }}
          IMAGE_CALL_LIMIT: ${{ inputs.max_image_calls }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from videoforge.generators.autoeditor import load_manifest, plan
          from videoforge.production.scene_layers import MAX_IMAGE_REQUESTS
          root=Path.cwd().resolve()
          supplied=Path(os.environ["JOB_MANIFEST"])
          full=(root/supplied).resolve()
          if (supplied.is_absolute() or ".." in supplied.parts
                  or not (full.is_relative_to(root/"geradores")
                          or full.is_relative_to(root/"canal"))
                  or full.is_symlink()):
              raise SystemExit("AUTOEDITOR_RENDER_MANIFEST_PATH_NOT_ALLOWED")
          try:
              cap=int(os.environ["IMAGE_CALL_LIMIT"])
          except (TypeError, ValueError):
              raise SystemExit("AUTOEDITOR_RENDER_BUDGET_INVALID") from None
          if cap < 1 or cap > MAX_IMAGE_REQUESTS:
              raise SystemExit("AUTOEDITOR_RENDER_BUDGET_INVALID")
          manifest=load_manifest(full)
          expected=plan(manifest)["planned_image_calls"]
          if cap < expected:
              raise SystemExit("AUTOEDITOR_RENDER_BUDGET_TOO_LOW_NEED_"+str(expected))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("VIDEOFORGE_CHANNEL="+manifest["canal"]+"\n")
          print("AUTOEDITOR_RENDER_BUDGET_EXPLICITLY_SUFFICIENT_"+str(expected))
          print("AUTOEDITOR_REVIEW_PREVIEW_ONLY_NOT_AGENT_SELECTED_OR_PUBLISHED")
          PY
      - name: Compilar o proxy Go sem segredos
        working-directory: upstream-codex-proxy
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/videoforge-autoeditor-proxy" ./cmd/api
      - name: Gerar video privado de revisao, sem acesso ao YouTube
        shell: bash
        env:
          JOB_MANIFEST: ${{ inputs.manifest || 'geradores/autoeditor/exemplo-manifesto.json' }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          PILOT_JOB_ID: vf-${{ github.run_id }}
          VF_CHECK_TOKEN: ${{ github.token }}
          IMAGE_CALL_LIMIT: ${{ inputs.max_image_calls }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PROXY_API_KEY"
          test -n "$PROXY_ACCOUNTS_JSON"
          private_dir="$RUNNER_TEMP/videoforge-autoeditor-private"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir"
            rm -f -- "$RUNNER_TEMP/videoforge-autoeditor-proxy.log"
          }
          trap cleanup EXIT
          python - <<'PY'
          import os
          from pathlib import Path
          from videoforge.proxy.private_state import stage_private_state
          from videoforge.generators.autoeditor import load_manifest,plan
          from videoforge.channel_agents.storage import channel_output_root
          root=Path.cwd().resolve()
          path=(root/Path(os.environ["JOB_MANIFEST"])).resolve()
          if not (path.is_relative_to(root/"geradores") or path.is_relative_to(root/"canal")):
              raise SystemExit("AUTOEDITOR_MANIFEST_PATH_NOT_ALLOWED")
          if path.is_symlink() or not path.is_file():
              raise SystemExit("AUTOEDITOR_MANIFEST_UNSAFE")
          p=plan(load_manifest(path))
          expected=int(os.environ["IMAGE_CALL_LIMIT"])
          if not (1 <= expected <= 48 and
                  p["planned_image_calls"] <= expected and
                  p["youtube_uploaded"] is False):
              raise SystemExit("AUTOEDITOR_LAYER_IMAGE_BUDGET_NOT_AUTHORIZED")
          print("AUTOEDITOR_LAYER_REQUESTS_PLANNED_"+str(p["planned_image_calls"]))
          stage_private_state(os.environ["PROXY_ACCOUNTS_JSON"],
               Path(os.environ["RUNNER_TEMP"])/"videoforge-autoeditor-private")
          print("AUTOEDITOR_OAUTH_STAGED_PRIVATELY")
          PY
          unset PROXY_ACCOUNTS_JSON
          env -u VF_CHECK_TOKEN DATA_DIR="$private_dir" "$RUNNER_TEMP/videoforge-autoeditor-proxy" \
            >"$RUNNER_TEMP/videoforge-autoeditor-proxy.log" 2>&1 &
          proxy_pid=$!
          python - <<'PY'
          import time
          from videoforge.proxy.client import ProxyClient, ProxyError
          client=ProxyClient(timeout=3)
          for i in range(90):
              try:
                  if client.health_live().get("status")=="ok":
                      print("AUTOEDITOR_PROXY_READY")
                      break
              except (ProxyError,ValueError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("AUTOEDITOR_PROXY_NOT_READY")
          PY
          python -m videoforge.generators.autoeditor \
            --action produce --manifest "$JOB_MANIFEST" \
            --output "$GITHUB_WORKSPACE/output/$VIDEOFORGE_CHANNEL/videos/autoeditor-$PILOT_JOB_ID" \
            --motion-root "$GITHUB_WORKSPACE/autoeditor-source/motion-remotion" \
            --job-id "$PILOT_JOB_ID" --max-image-calls "$IMAGE_CALL_LIMIT"
      - name: Verificar MP4, procedencia, referencia visual e bloqueio de upload
        shell: bash
        env:
          PILOT_JOB_ID: vf-${{ github.run_id }}
          JOB_MANIFEST: ${{ inputs.manifest || 'geradores/autoeditor/exemplo-manifesto.json' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from videoforge.production.image_policy import validate_generated_visuals
          from videoforge.production.quality_gate import inspect_media
          root=(Path("output")/os.environ["VIDEOFORGE_CHANNEL"]/"videos"/
                ("autoeditor-"+os.environ["PILOT_JOB_ID"]))
          report=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          images=json.loads((root/"imagens.json").read_text(encoding="utf-8"))
          from videoforge.production.visual_lock import verify_anchor_trace
          from videoforge.generators.autoeditor import load_manifest
          manifest_path=os.environ["JOB_MANIFEST"]
          bible=load_manifest(manifest_path)["visual_lock"]
          audit=verify_anchor_trace(images["assets"], bible)
          assert audit["anchor_reference_provenance_verified"] is True
          assert audit["actual_visual_identity_verified"] is False
          assert audit["youtube_upload_approved"] is False
          assert images.get("visual_audit")==audit
          qa=json.loads((root/"qa-imagens.json").read_text(encoding="utf-8"))
          assert qa["publication_blocked_pending_independent_visual_review"] is True

          from videoforge.production.scene_layers import verify_scene_layers
          full=load_manifest(manifest_path)
          layer_doc=json.loads((root/"scene-layers.json").read_text(encoding="utf-8"))
          layer_qa=verify_scene_layers(full, root, layer_doc)
          motion_qa=json.loads((root/"qa-motion.json").read_text(encoding="utf-8"))
          motion_props=json.loads((root/"remotion-props.json").read_text(encoding="utf-8"))
          from videoforge.motion.remotion_overlay import TS
          from hashlib import sha256
          assert motion_qa["motion_overlay_sha256"] == sha256(TS.read_bytes()).hexdigest()
          assert motion_props["motionOverlaySha256"] == motion_qa["motion_overlay_sha256"]
          assert motion_qa["human_approval_required"] is True
          assert motion_qa["youtube_upload_approved"] is False
          assert report["motion_overlay_sha256"] == motion_qa["motion_overlay_sha256"]
          assert motion_qa["configured_motion_cues"] == report["motion_cues"]
          assert layer_qa["true_png_transparency_verified"] is True
          assert layer_qa["subject_alignment_verified"] is False
          assert layer_qa["approved_for_youtube"] is False
          assert report["layer_image_requests"] == layer_doc["image_requests"]
          assert report["image_requests"] == layer_doc["total_image_requests"]
          assert report["generated_images"] == len(images["assets"]) >= 3
          assert report["fallback_images"] == 0
          assert report["human_approved"] is False
          assert report["youtube_uploaded"] is False
          validate_generated_visuals(images["assets"],root,expected_count=len(images["assets"]))
          media=inspect_media(root/"video.mp4")
          assert media["sha256"] == report["media"]["sha256"]
          assert 90 <= media["duration_seconds"] <= 180.5
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## AutoEditor - video de revisao\n\n")
              f.write(f"Cenas-mãe: {len(images['assets'])}; edições RGBA: {layer_doc['image_requests']}; fallback zero.\n\n")
              f.write(f"MP4: {media['duration_seconds']}s, 1080x1920, hash confirmado.\n\n")
              f.write("QA editorial pendente. Nenhum envio ao YouTube.\n")
          print("AUTOEDITOR_REAL_VIDEO_VERIFIED_NO_YOUTUBE")
          PY
      - name: Entregar artefatos de revisao sem credenciais
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autoeditor-preview-${{ github.run_id }}
          path: |
            output/*/videos/autoeditor-vf-${{ github.run_id }}/video.mp4
            output/*/videos/autoeditor-vf-${{ github.run_id }}/scene-*.png
            output/*/videos/autoeditor-vf-${{ github.run_id }}/scene-*/**
            output/*/videos/autoeditor-vf-${{ github.run_id }}/scene-layers.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/qa-camadas.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/qa-motion.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/imagens.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/manifest.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/qa-editorial.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/qa-tecnico.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/qa-imagens.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/deduplicacao.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/roteiro.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/storyboard.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/legendas.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/briefing.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/plano.json
            output/*/videos/autoeditor-vf-${{ github.run_id }}/remotion-props.json
          retention-days: 7
          if-no-files-found: error
