name: VideoForge AI - Escritorio de Agentes (Pages)

# Publica automaticamente mudancas do painel na main e aceita execucao manual.
# A pagina exibe apenas um snapshot saneado, sem tokens ou execucao de IA.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "agentes/**"
      - "canal/**"
      - "scripts/build_dashboard_data.py"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videoforge-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes da aplicacao
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript
        run: |
          node --check site/app.js
          node --check site/agent-animator.js
          node --check site/office-art.js
          node --check site/office-renderer.js
      - name: Gerar snapshot publico sem segredos
        run: python scripts/build_dashboard_data.py --output site/data/status.json
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
