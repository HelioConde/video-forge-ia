name: PixelLab - Importar animacoes Alex para site

# Executar apenas uma vez após exportação validada; nenhuma geração paga.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pixellab-import-alex.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pixellab-import-alex
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência para montar spritesheets
        run: python -m pip install "Pillow>=10,<13"
      - name: Baixar exportação já aprovada do PixelLab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42853882006 -R "${{ github.repository }}" \
            -n pixellab-alex-export-42853882006 -D /tmp/pixellab-alex-export
      - name: Validar e montar seis spritesheets de quatro frames
        run: |
          python scripts/import_pixellab_agents.py /tmp/pixellab-alex-export/character-frames.zip
      - name: Versionar PNGs no repositório
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/pixellab/agents/alex/
          if git diff --cached --quiet; then
            echo "Atlas já presente; não duplicar arquivos"
            exit 0
          fi
          git commit -m "assets: inclui animacoes do Alex em seis atlases PNG"
          git pull --rebase origin main
          git push origin HEAD:main
