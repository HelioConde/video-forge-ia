name: PixelLab - Atualizar walk do Alex

# Somente GET: usa a nova animação de caminhada se ela existir e estiver completa.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pixellab-walk-upgrade.yml"
  workflow_dispatch:
    inputs:
      preferred:
        description: "Nome do grupo de caminhada mais recente (opcional)"
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pixellab-walk-upgrade
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar atualização sem chamadas pagas
        run: |
          python -m pip install "Pillow>=10,<13"
          python -m unittest discover -s tests -p 'test_pixellab_walk_upgrade.py' -v
      - name: Baixar animações existentes do Alex (GET)
        env:
          PIXELLAB_API_TOKEN: ${{ secrets.PIXELLAB_API_TOKEN }}
          PIXELLAB_TARGET_FINGERPRINT: "9708e3207969cd208f819d20d74960fa07d88b7df17470da4c7d303f0fd08a45"
        run: python scripts/export_pixellab_ready.py --source /tmp/pixellab-walk-export.zip
      - name: Trocar walk só se nova animação tiver 8 direções e 32 frames
        env:
          PREFERRED: ${{ inputs.preferred }}
        run: |
          if [ -f /tmp/pixellab-walk-export.zip ]; then
            if [ -n "$PREFERRED" ]; then
              python scripts/refresh_pixellab_walk.py --source /tmp/pixellab-walk-export.zip --preferred "$PREFERRED"
            else
              python scripts/refresh_pixellab_walk.py --source /tmp/pixellab-walk-export.zip
            fi
          else
            echo "PixelLab ainda não liberou o ZIP: walk antigo preservado."
          fi
      - name: Validar e versionar caminhada
        id: commit
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          python scripts/verify_pixellab_assets.py
          git add -- site/assets/pixellab/agents/alex/walk.png site/assets/pixellab/agents/alex/manifest.json
          if git diff --cached --quiet; then
            echo "Sem nova caminhada válida; mantendo o walk anterior."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: atualiza walk com animacao PixelLab mais recente"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Salvar relatório sem dados privados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-studio-walk-${{ github.run_id }}
          path: output/pixellab-production/walk-upgrade.json
          retention-days: 7
          if-no-files-found: warn

  pages:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
