name: PixelLab - Importar agencia gerada (execucao unica)

# Transfere somente o PNG anteriormente produzido. Nao gera nem cobra PixelLab.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pixellab-agency-import-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: pixellab-agency-import-once
  cancel-in-progress: false

jobs:
  import:
    if: >-
      ${{ github.run_attempt == 1 && github.event.head_commit.message == 'chore(pixellab): importar cenario unico aprovado tentativa2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Importar apenas o PNG validado do artifact concluido
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/videoforge-scene
          gh run download 43039103117 -n pixellab-agency-once-43039103117 -D /tmp/videoforge-scene
          python - <<'PY'
          import hashlib, struct
          from pathlib import Path
          src = Path('/tmp/videoforge-scene/scene.png')
          raw = src.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          expected = 'c975d4c04c2ac885efc9e12ad5158afe413bf79ca29819e03fa071ac8c107c54'
          assert sha == expected, 'SHA256 do PNG nao corresponde ao artifact aprovado'
          assert len(raw) < 10_000_000 and raw[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',raw[16:24]) == (688,384)
          target = Path('site/assets/pixellab/scenes/agencia-unificada.png')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(raw)
          print('PIXELLAB_AGENCIA_IMPORTADA: PNG validado em 688x384')
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add site/assets/pixellab/scenes/agencia-unificada.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(pixellab): incorporar panorama unificado da agencia"
            git push origin HEAD:main
          fi
