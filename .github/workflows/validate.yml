name: Validar VideoForge AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow para testar recepção de imagens
        run: python -m pip install "Pillow>=10,<13"
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Testar comando PixelLab em dry-run
        run: python -m videoforge.pixellab.cli --operation plan --character alex --motion idle --direction south --output /tmp/videoforge-pixellab-plan
      - name: Validar JavaScript do painel
        run: |
          node --check site/app.js
          node --check site/agent-animator.js
          node --check site/agent-routines.js
          node tests/test_agent_routines.js
          node --check site/office-art.js
          node --check site/office-renderer.js
      - name: Gerar e validar snapshot público
        run: python scripts/build_dashboard_data.py --output /tmp/videoforge-status.json
      - name: Simular storyboard de 10 segundos (sem publicar)
        run: python -m videoforge.pipeline --video canal/alchemy-lab/videos/teste-10s/video.json --output output/storyboard.json
      - name: Salvar storyboard de teste
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-dry-run
          path: output/storyboard.json
