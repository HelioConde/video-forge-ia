name: Validar VideoForge AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de validação de imagens e cifra
        run: python -m pip install "Pillow>=10,<13" "cryptography>=43,<50"
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Buscar Remotion original da era Fofinho
        uses: actions/checkout@v4
        with:
          repository: HelioConde/AutoEditorVideo
          ref: ec85db5bc74455122e4501aba05bd2dd3fd0df2c
          path: .work/autoeditor-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .work/autoeditor-source/motion-remotion/package-lock.json
      - name: Instalar Remotion para validar TS e frames sem render ou IA
        working-directory: .work/autoeditor-source/motion-remotion
        run: npm ci
      - name: Aplicar overlay e testar motor real do Fofinho por quadros
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from videoforge.motion.remotion_overlay import apply_motion_overlay
          project=Path(".work/autoeditor-source/motion-remotion")
          print("VIDEOFORGE_REMOTION_SHA256_"+apply_motion_overlay(project))
          PY
          cd .work/autoeditor-source/motion-remotion
          npm run typecheck
          node "$GITHUB_WORKSPACE/tests/test_fofinho_motion.cjs"
      - name: Testar comando PixelLab em dry-run
        run: python -m videoforge.pixellab.cli --operation plan --character alex --motion idle --direction south --output /tmp/videoforge-pixellab-plan
      - name: Validar JavaScript do painel
        run: |
          node --check site/office-live.js
          node --check site/app.js
          node --check site/agent-animator.js
          node --check site/agent-interactions.js
          node --check site/office-map.js
          node --check site/agent-routines.js
          node --check site/agent-behavior.js
          node tests/test_office_live.js
          node tests/test_agent_behavior.js
          node tests/test_office_map.js
          node tests/test_office_layout.js
          node tests/test_agent_seating.js
          node tests/test_agent_interactions.js
          node tests/test_agent_routines.js
          node tests/test_walk_animator.js
          node --check site/office-art.js
          node --check site/office-renderer.js
      - name: Gerar e validar snapshot público
        run: python scripts/build_dashboard_data.py --output /tmp/videoforge-status.json
      - name: Simular storyboard de 10 segundos (sem publicar)
        run: python -m videoforge.pipeline --video canal/alchemy-lab/videos/teste-10s/video.json --output output/storyboard.json
      - name: Salvar storyboard de teste
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-dry-run
          path: output/storyboard.json
