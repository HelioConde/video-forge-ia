name: Validar VideoForge AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Simular storyboard de 10 segundos (sem publicar)
        run: python -m videoforge.pipeline --config config/example.json --output output/storyboard.json
      - name: Salvar storyboard de teste
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-dry-run
          path: output/storyboard.json
