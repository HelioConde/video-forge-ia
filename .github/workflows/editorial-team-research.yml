name: VideoForge - Equipe Otaku decide pauta (somente pesquisa)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [offline, pesquisar-com-agents]
        default: offline
        required: true
      authorize_research:
        type: boolean
        default: false
        required: true
  pull_request:
    paths:
      - '.github/workflows/editorial-team-research.yml'
      - '.github/workflows/agent-one-briefing.yml'
      - 'videoforge/channel_agents/**'
      - 'tests/test_editorial_team.py'
      - 'tests/test_secure_editorial_report.py'

permissions:
  contents: read
  statuses: write  # fallback verificavel das etapas por funcionario
  checks: write

concurrency:
  group: editorial-team-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'offline')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=43,<50'
      - run: |
          python -m unittest discover -s tests -p 'test_secure_editorial_report.py' -v
          python -m unittest discover -s tests -p 'test_editorial_team.py' -v
          python -m unittest discover -s tests -p 'test_role_events.py' -v

  research:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'HelioConde' &&
      github.run_attempt == 1 &&
      inputs.mode == 'pesquisar-com-agents' &&
      inputs.authorize_research == true
    runs-on: ubuntu-24.04
    environment: proxy-runtime
    timeout-minutes: 30
    env:
      CHANNEL_IDEATION_APPROVED: 'yes'
      GIN_MODE: release
      DEBUG_LOG_PAYLOADS: 'false'
      PORT: '8080'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 10/chatgpt-codex-proxy
          ref: 1da5476e46ef62830d7016de2a931b0b8270a6c4
          path: upstream-codex-proxy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version-file: upstream-codex-proxy/go.mod
          cache: false
      - name: Testar agentes antes de usar segredos
        run: |
          python -m unittest discover -s tests -p 'test_editorial_team.py' -v
          python -m unittest discover -s tests -p 'test_channel_managers.py' -v
          python -m unittest discover -s tests -p 'test_role_events.py' -v
      - name: Instalar cifra autenticada antes de usar segredos
        run: python -m pip install --disable-pip-version-check 'cryptography>=43,<50'
      - name: Compilar proxy pinado
        working-directory: upstream-codex-proxy
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/videoforge-team-proxy" ./cmd/api
      - name: Pesquisador IA, gerente e subgerente escolhem e auditam
        shell: bash
        env:
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          PROXY_ACCOUNTS_JSON: ${{ secrets.PROXY_ACCOUNTS_JSON }}
          VIDEOFORGE_DRAFT_ENCRYPTION_KEY_B64: ${{ secrets.VIDEOFORGE_DRAFT_ENCRYPTION_KEY_B64 }}
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_CHANNEL_TOKEN_JSON: ${{ secrets.YOUTUBE_OTAKU_BR_TOKEN_JSON }}
          VF_CHECK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$YOUTUBE_CLIENT_JSON" || -z "$YOUTUBE_CHANNEL_TOKEN_JSON" ]]; then
            echo 'TEAM_BLOCKED_YOUTUBE_READONLY_CREDENTIALS_MISSING'
            exit 1
          fi
          if [[ -z "$PROXY_API_KEY" || -z "$PROXY_ACCOUNTS_JSON" ]]; then
            echo 'TEAM_BLOCKED_PROXY_CREDENTIALS_MISSING'
            exit 1
          fi
          if [[ -z "$VIDEOFORGE_DRAFT_ENCRYPTION_KEY_B64" ]]; then
            echo 'TEAM_BLOCKED_REPORT_ENCRYPTION_KEY_MISSING'
            exit 1
          fi
          private_dir="$RUNNER_TEMP/video-forge-team-state"
          proxy_pid=''
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            rm -rf -- "$private_dir" "$RUNNER_TEMP/videoforge-editorial-stage"
            rm -f -- "$RUNNER_TEMP/videoforge-editorial-proxy.log"
          }
          trap cleanup EXIT
          python - <<'PY'
          import os
          from pathlib import Path
          from videoforge.proxy.private_state import stage_private_state
          stage_private_state(os.environ['PROXY_ACCOUNTS_JSON'],
              Path(os.environ['RUNNER_TEMP'])/'video-forge-team-state')
          print('TEAM_PRIVATE_STATE_VALIDATED')
          PY
          unset PROXY_ACCOUNTS_JSON
          env -u VF_CHECK_TOKEN -u YOUTUBE_CLIENT_JSON -u YOUTUBE_CHANNEL_TOKEN_JSON \
            -u VIDEOFORGE_DRAFT_ENCRYPTION_KEY_B64 \
            DATA_DIR="$private_dir" "$RUNNER_TEMP/videoforge-team-proxy" \
            >"$RUNNER_TEMP/videoforge-editorial-proxy.log" 2>&1 &
          proxy_pid=$!
          python - <<'PY'
          import time
          from videoforge.proxy.client import ProxyClient,ProxyError
          proxy=ProxyClient(timeout=3)
          for _ in range(90):
              try:
                  if proxy.health_live().get('status')=='ok':
                      print('TEAM_PROXY_READY')
                      break
              except (ProxyError,ValueError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit('TEAM_PROXY_NOT_READY')
          PY
          mkdir -p output/editorial-team
          python -m videoforge.channel_agents.team --channel otaku-br \
            --days 90 --model auto --output output/editorial-team/decisao.json
      - name: Confirmar pauta escolhida pelos agents e sem publicacao
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('output/editorial-team/decisao.json').read_text(encoding='utf-8'))
          assert j['schema']=='videoforge/editorial-team/v1'
          assert j['channel']=='otaku-br'
          assert j['decision_authority']=='Gerente Otaku Multicena'
          assert j['choices_from_assistant']==0
          assert j['proxy_calls']==1
          assert j['images_generated']==0 and j['video_generated'] is False
          assert j['upload_enabled'] is False
          assert j['chosen_topic'] and j['requires_human_editorial_review']
          assert j['chosen_topic']['anime'].casefold()!='death note'
          print('TEAM_DECISION_VERIFIED_NO_IMAGE_NO_VIDEO_NO_UPLOAD')
          PY
      - name: Criptografar resultado editorial e remover texto do workspace
        shell: bash
        env:
          VIDEOFORGE_DRAFT_ENCRYPTION_KEY_B64: ${{ secrets.VIDEOFORGE_DRAFT_ENCRYPTION_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          # An encrypted artifact is the ONLY durable output of research.
          python -m videoforge.channel_agents.secure_report encrypt \
            --source output/editorial-team/decisao.json \
            --source-run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/videoforge-editorial-encrypted/decisao.encrypted.json"
          rm -rf -- output/editorial-team
      - name: Enviar apenas decisao AES-256-GCM para revisao protegida
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: otaku-multicena-agents-decisao-cifrada-${{ github.run_id }}
          path: ${{ runner.temp }}/videoforge-editorial-encrypted/decisao.encrypted.json
          retention-days: 7
          if-no-files-found: error
