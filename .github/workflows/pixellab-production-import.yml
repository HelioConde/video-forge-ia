name: PixelLab - Importar animacoes novas para o Canvas

# Só exporta (GET) e versiona atlas quando todas as novas direções estiverem
# concluídas e o workflow anterior tiver sucesso. Nenhum POST pago.
on:
  workflow_run:
    workflows: ["PixelLab - Completar animacoes da produtora"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pixellab-import-production
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências de imagem
        run: python -m pip install "Pillow>=10,<13"
      - name: Exportar frames existentes sem iniciar novas gerações
        env:
          PIXELLAB_API_TOKEN: ${{ secrets.PIXELLAB_API_TOKEN }}
          PIXELLAB_TARGET_FINGERPRINT: "9708e3207969cd208f819d20d74960fa07d88b7df17470da4c7d303f0fd08a45"
        run: |
          mkdir -p /tmp/video-forge-export
          python - <<'PY'
          import os
          from pathlib import Path
          from videoforge.pixellab.client import PixelLabClient
          from videoforge.pixellab.launch import resolve_target
          client=PixelLabClient(os.environ["PIXELLAB_API_TOKEN"])
          cid=resolve_target(client,os.environ["PIXELLAB_TARGET_FINGERPRINT"])
          Path("/tmp/video-forge-export/character-frames.zip").write_bytes(
              client.download(cid,spritesheet=False)
          )
          print("Exportação feita somente por GET")
          PY
      - name: Validar todos os novos frames e compor atlas
        run: python scripts/import_pixellab_production.py --source /tmp/video-forge-export/character-frames.zip
      - name: Versionar atlas públicos sem metadados privados
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/pixellab/agents/alex/production/
          if git diff --cached --quiet; then
            echo "Atlases já importados, sem commit novo"
            exit 0
          fi
          git commit -m "assets: importa animacoes sociais e profissionais PixelLab"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Salvar somente contagem de importações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: producer-import-${{ github.run_id }}
          path: output/production-import-summary.json
          retention-days: 7
          if-no-files-found: warn
