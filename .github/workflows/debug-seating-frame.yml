name: Debug PixelLab sit frames - inspection only
on:
  push:
    branches:
      - fix/seated-pose-sprite-alignment
    paths:
      - ".github/workflows/debug-seating-frame.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - name: Montar comparacao das poses reais - sem chamar API
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          base=Path("site/assets/pixellab/agents/alex")
          dest=Path("output/sit-debug")
          dest.mkdir(parents=True,exist_ok=True)
          directions={"south":0,"north":4,"east":2,"west":6}
          motions=["sit","idle"]
          canvas=Image.new("RGB",(4*176,8*196),(38,49,61))
          d=ImageDraw.Draw(canvas)
          for motion_idx,motion in enumerate(motions):
              src=Image.open(base/(motion+".png")).convert("RGBA")
              for dir_idx,(direction,row) in enumerate(directions.items()):
                  for frame in range(4):
                      tile=src.crop((frame*88,row*88,(frame+1)*88,(row+1)*88))
                      tile=tile.resize((160,160),Image.Resampling.NEAREST)
                      x=frame*176+8;y=(motion_idx*4+dir_idx)*196+22
                      canvas.paste(tile,(x,y),tile)
                      d.text((x,y-18),f"{motion} {direction} #{frame}",fill=(255,255,255))
          canvas.save(dest/"poses.png")
          import json
          manifest=json.loads((base/"production"/"manifest.json").read_text())
          examples=["sit_down","sing_seated","keyboard_shortcuts","sit_on_sofa","lean_back","adjust_chair","keyboard_type"]
          board=Image.new("RGB",(4*176,len(examples)*196),(38,49,61))
          bd=ImageDraw.Draw(board)
          for idx,motion in enumerate(examples):
              spec=manifest["motions"][motion]
              src=Image.open(base/"production"/spec["file"]).convert("RGBA")
              direction="north" if "north" in spec["directions"] else spec["directions"][0]
              row=spec["directions"].index(direction)
              for frame in range(4):
                  tile=src.crop((frame*88,row*88,(frame+1)*88,(row+1)*88)).resize((160,160),Image.Resampling.NEAREST)
                  x=frame*176+8;y=idx*196+22
                  board.paste(tile,(x,y),tile)
                  bd.text((x,y-18),f"{motion} {direction} #{frame}",fill=(255,255,255))
          board.save(dest/"production-poses.png")
          # Previa estatico da composicao original do Canvas, sem navegador nem API.
          background=Image.open("site/assets/pixellab/scenes/agencia-unificada.png").convert("RGBA")
          office=Image.new("RGBA",(1280,820),(16,32,48,255))
          crop=background.crop((96,54,96+492,54+285)).resize((1188,660),Image.Resampling.NEAREST)
          office.alpha_composite(crop,(46,110))
          sit=Image.open(base/"production"/"sit_down.png").convert("RGBA")
          chair_pose=sit.crop((3*88,88,4*88,2*88))
          for x,y in [(255,254),(394,254),(592,254),(739,254),(1007,254),(1124,254),(255,449),(384,449)]:
              center_y=y+111+14
              office.alpha_composite(chair_pose,(x-44,center_y-44))
          office.convert("RGB").save(dest/"office-seated-preview.png")
          print("SEATED_POSE_INSPECTION_READY")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seated-poses-review
          path: output/sit-debug/
          retention-days: 2
