name: VideoForge - Receber demanda do gerente

# Cria um plano de produção, não executa IA nem faz upload de vídeos.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Identificador único da demanda (ex: otaku-001)"
        required: true
        type: string
      canal:
        description: "Canal"
        required: true
        type: choice
        options:
          - otaku-br
          - otaku-en
          - gamer
          - manu-kids
          - alchemy-lab
      tema:
        description: "Briefing / tema do vídeo"
        required: true
        type: string
      duracao_segundos:
        description: "Duração entre 5 e 7200 segundos"
        required: true
        type: number
        default: 90

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar motor de delegação
        run: python -m unittest discover -s tests -p 'test_delegation.py' -v
      - name: Receber briefing e distribuir as 18 tarefas
        env:
          VIDEO_ID: ${{ inputs.id }}
          VIDEO_CHANNEL: ${{ inputs.canal }}
          VIDEO_TOPIC: ${{ inputs.tema }}
          VIDEO_DURATION: ${{ inputs.duracao_segundos }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          duration=int(os.environ["VIDEO_DURATION"])
          demand={
              "id":os.environ["VIDEO_ID"],
              "canal":os.environ["VIDEO_CHANNEL"],
              "tema":os.environ["VIDEO_TOPIC"],
              "duracao_segundos":duration,
          }
          root=Path("output/gerente")
          root.mkdir(parents=True,exist_ok=True)
          (root/"demanda.json").write_text(
              json.dumps(demand,indent=2,ensure_ascii=False)+"\n",encoding="utf-8"
          )
          PY
          python -m videoforge.production.dispatcher --demand output/gerente/demanda.json --output output/gerente/plano.json
      - name: Vincular os 18 cargos aos recursos do Codex Proxy (somente plano)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from videoforge.proxy.roles import plan_bindings
          root=Path("output/gerente")
          plan=json.loads((root/"plano.json").read_text(encoding="utf-8"))
          bindings=plan_bindings(plan)
          (root/"proxy-tarefas.json").write_text(
              json.dumps(bindings,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8"
          )
          print("PROXY_STAGE_BINDINGS_READY_18_ZERO_API_CALLS")
          PY
      - name: Preparar checklist de qualidade para QA independente (sem IA)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from videoforge.production.quality_template import review_template
          root = Path("output/gerente")
          plan = json.loads((root/"plano.json").read_text(encoding="utf-8"))
          review = review_template(plan)
          (root/"quality-review-template.json").write_text(
              json.dumps(review, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          assert review["status"] == "awaiting_real_media_and_independent_qa"
          assert all(v["score"] is None for v in review["scores"].values())
          print("QA_TEMPLATE_PENDING_NO_FAKE_SCORES_NO_GENERATION")
          PY
      - name: Relatório da delegação (sem execução ou publicação)
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("output/gerente/plano.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fp:
              fp.write("## Demanda recebida — planejamento de equipe\n\n")
              fp.write(f"**Canal:** {d['demand']['canal']} · **Tarefas:** {len(d['tasks'])}\n\n")
              fp.write("Tarefas relacionadas aos recursos do Codex Proxy (somente plano).\\n\\n")
              fp.write("Nenhum agente IA executado, nenhuma chave lida, nenhum vídeo publicado.\\n")
          PY
      - name: Salvar demanda e plano
        uses: actions/upload-artifact@v4
        with:
          name: demand-plan-${{ github.run_id }}
          path: output/gerente/
          retention-days: 7
          if-no-files-found: error
