name: PixelLab - Inventario de cenarios e objetos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pixellab-office-audit.yml"

permissions:
  contents: read

concurrency:
  group: pixellab-office-assets
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar planejamento sem custos
        run: python -m unittest discover -s tests -p 'test_pixellab*.py' -v
      - name: Consultar apenas GET de salas e objetos PixelLab
        env:
          PIXELLAB_API_TOKEN: ${{ secrets.PIXELLAB_API_TOKEN }}
        run: python -m videoforge.pixellab.office_assets --mode plan --stage all
      - name: Guardar relatório sem IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-audit-${{ github.run_id }}
          path: output/pixellab-office/report.json
          retention-days: 7
          if-no-files-found: warn
